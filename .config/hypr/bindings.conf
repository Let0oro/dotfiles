# bindd = ALT, PRINT, Screen Recording, exec, omarchy-launch-tui wf-recorder -f /home/juanma/Videos/ScreenCasts/salida.mp4
# bindd = ALT, PRINT, Screen Recording, exec, omarchy-launch-tui wl-screenrec --low-power=off -f ~/Videos/ScreenCasts/salida.mp4 &
# bindd = ALT, PRINT, Screen Recording, exec, omarchy-launch-tui omarchy-cmd-screenrecord
