#bindd = SUPER, F4, Mouse Able/Disable, exec, /home/juanma/Documents/scripts/toggle_touchpad.sh
bindd = SUPER ALT, F4, Mouse Able, exec, hyprctl keyword "device[cust0001:00-06cb:cdaa-touchpad]:enabled" true
bindd = SUPER, F4, Mouse Disable, exec, hyprctl keyword "device[cust0001:00-06cb:cdaa-touchpad]:enabled" false

# Super+B para alternar entre Waybar y eww
bind = SUPER, B, exec, \
  if pgrep waybar; then \
    pkill waybar && eww daemon && eww open bar; \
  else \
    pkill eww && uwsm app -- waybar; \
  fi

