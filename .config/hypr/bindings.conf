# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
# bindd = SUPER SHIFT, F, File manager, exec, omarchy-launch-tui yazi
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker Handbook, exec, omarchy-launch-webapp "https://docker-handbook.farhan.dev/"
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT ALT, D, Datacamp, exec, omarchy-launch-webapp "https://app.datacamp.com/"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER, A, Perplexity, exec, omarchy-launch-webapp "https://www.perplexity.ai/"
bindd = SUPER ALT, A, NotebookLM, exec, omarchy-launch-webapp "https://notebooklm.google.com/"
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/app"
bindd = SUPER CTRL, A, Claude, exec, omarchy-launch-webapp "https://claude.ai/new"
bindd = SUPER CTRL, A, Jules, exec, omarchy-launch-webapp "https://jules.google.com/session"
# bindd = SUPER SHIFT CTRL, A, Google AI Studio, exec, omarchy-launch-webapp "https://aistudio.google.com/apps"
# bindd = SUPER SHIFT CTRL, A, Kiro, exec, kiro
bindd = SUPER SHIFT CTRL, A, Antigravity, exec, antigravity 
bindd = SUPER SHIFT, G, Gmail, exec, omarchy-launch-webapp "https://mail.google.com/mail/"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, W, WhatsApp, exec, omarchy-launch-webapp "https://web.whatsapp.com/"
bindd = SUPER SHIFT ALT, T, Telegram, exec, Telegram
bindd = SUPER SHIFT ALT, N, Notion, exec, omarchy-launch-webapp "https://www.notion.so/FP-DAM-Retamar-257ca4d7607b8051a715c1fb594cd0eb"
bindd = SUPER SHIFT, C, Classroom, exec, omarchy-launch-webapp "https://classroom.google.com/h"
bindd = SUPER SHIFT ALT, C, Cisco, exec, omarchy-launch-webapp "https://www.netacad.com/dashboard"
bindd = SUPER SHIFT ALT, 3, ThreeJourney, exec, omarchy-launch-webapp "https://threejs-journey.com/lessons/introduction"
bindd = SUPER SHIFT ALT, G, Github, exec, omarchy-launch-webapp "https://github.com/"
bindd = SUPER SHIFT CTRL, G, Google Collab, exec, omarchy-launch-webapp "https://colab.research.google.com/"
bindd = SUPER SHIFT, P, Packet Tracer - Cisco, exec, packettracer



# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, SPACE
bind = SUPER, Space, exec, rofi -show drun
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
unbind = ALT, PRINT
